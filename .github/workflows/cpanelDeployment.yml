name: Deploy Laravel App to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set DEPLOYPATH
        run: echo "DEPLOYPATH=/home/gkzxhmso/repositories/EcomGadgets" >> $GITHUB_ENV

      - name: Copy project files to cPanel (via FTP or SSH)
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
           server: ${{ secrets.CPANEL_FTP_SERVER }}
           username: ${{ secrets.CPANEL_FTP_USERNAME }}
           password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ env.DEPLOYPATH }}
          exclude: |
            .git*
            node_modules/
            tests/
            .env
            storage/
            vendor/

      - name: SSH into server and run Laravel post-deployment commands
        uses: appleboy/ssh-action@v1.0.3
        with:
           server: ${{ secrets.CPANEL_FTP_SERVER }}
           username: ${{ secrets.CPANEL_FTP_USERNAME }}
           password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          port: 22
          script: |
            cd $DEPLOYPATH
            cp .env.production .env
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache